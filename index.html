<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Commission Downline Splitter</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.app{max-width:1400px;margin:auto;padding:24px}.center{display:grid;place-items:center;min-height:100vh}.hero,.card,.stat,.auth{background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.hero{padding:28px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px}.hero h1{font-size:38px;line-height:1;margin:10px 0}.muted,.hero p{color:#64748b}.badge{display:inline-flex;background:#eef2ff;color:#3730a3;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px}.nav{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}.nav button{background:#e2e8f0}.nav button.on,.primary{background:#0f172a!important;color:white}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{padding:16px}.stat small{display:block;color:#64748b}.stat strong{font-size:22px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{padding:20px;margin-bottom:18px}h2{margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stack{display:grid;gap:12px}label{display:grid;gap:6px;font-weight:800;font-size:13px;color:#334155}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px;background:#fff;color:#0f172a;font-size:16px}textarea{min-height:120px}button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.notice{padding:12px;border-radius:14px;margin-bottom:14px}.err{background:#fff7ed;border:1px solid #fdba74;color:#9a3412}.ok{background:#ecfdf5;border:1px solid #86efac;color:#166534}.auth{max-width:460px;padding:30px;display:grid;gap:12px}.table{overflow:auto;border:1px solid #e2e8f0;border-radius:16px}.row{display:grid;gap:10px;align-items:center;padding:12px;border-top:1px solid #e2e8f0;min-width:900px}.row.head{border-top:0;background:#f1f5f9;color:#64748b;text-transform:uppercase;font-size:12px;font-weight:900}.row small{display:block;color:#64748b}.agentRow{grid-template-columns:1.4fr 1fr .8fr .8fr 1fr}.ledgerRow{grid-template-columns:1.3fr 1fr .8fr .8fr .8fr .8fr .8fr 1fr}.importRow{grid-template-columns:1.2fr 1fr .8fr .8fr .8fr .8fr 1.5fr}.payeeRow{grid-template-columns:1.5fr 1fr 1fr 1fr}.pill{padding:4px 8px;border-radius:999px;background:#e2e8f0}.paid{background:#dcfce7;color:#166534}.unpaid,.pending{background:#fef3c7;color:#92400e}.actions{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{border:2px dashed #cbd5e1;border-radius:18px;padding:18px;background:#f8fafc}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.two,.form{grid-template-columns:1fr}.hero{display:block}.hero h1{font-size:32px}}
</style>
</head>
<body>
<div id="app" class="center">Loading...</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.56.0'

const SUPABASE_URL = 'https://susiqseuoaorryqnlvwl.supabase.co'
const SUPABASE_KEY = 'sb_publishable_Tu-SYomgQ312CpEnS6x1pw_hXrLyVtF'
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
const app = document.getElementById('app')
const money = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'})
const today = new Date().toISOString().slice(0,10)
let session = null
let view = 'upload'
let agents = [], aliases = [], carrierNums = [], hier = [], agreements = [], sales = []
let importRows = [], unmatched = []

function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number(v || 0)}
function round(v){return Math.round(v*100)/100}
function msg(text, ok=false){const el=document.getElementById('msg'); if(el){el.className='notice '+(ok?'ok':'err'); el.textContent=text; el.style.display='block'} else alert(text)}

async function init(){
  try{
    const { data } = await supabase.auth.getSession()
    session = data.session
    supabase.auth.onAuthStateChange((_event,next)=>{session=next; render()})
    render()
  }catch(e){
    app.className='center'
    app.innerHTML='<div class="auth"><h1>Could not load app</h1><p class="muted">Refresh the page. If this continues, check Supabase settings.</p></div>'
  }
}

function auth(){
  app.className='center'
  app.innerHTML=`<form class="auth" id="login"><div class="badge">💵 Commission Downline Splitter</div><h1>Login</h1><p class="muted">Upload commission reports, identify writing agents and uplines, and calculate payouts.</p><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required minlength="6"></label><div id="loginmsg" class="notice err" style="display:none"></div><button class="primary">Sign In</button><button class="secondary" id="signup" type="button">Create Account</button></form>`
  document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const {error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginmsg.textContent=error.message;loginmsg.style.display='block'}})
  document.getElementById('signup').addEventListener('click',async()=>{const {error}=await supabase.auth.signUp({email:email.value,password:password.value});loginmsg.textContent=error?error.message:'Account created. If needed, check Supabase email confirmation settings.';loginmsg.style.display='block'})
}

async function load(){
  const [a,al,cn,h,ag,s] = await Promise.all([
    supabase.from('agents').select('*').order('legal_name'),
    supabase.from('agent_aliases').select('*'),
    supabase.from('agent_carrier_numbers').select('*'),
    supabase.from('agent_hierarchy').select('*').is('effective_end_date',null),
    supabase.from('override_agreements').select('*').is('effective_end_date',null),
    supabase.from('sales_with_agents').select('*').order('sale_date',{ascending:false})
  ])
  for(const r of [a,al,cn,h,ag,s]){ if(r.error) throw new Error(r.error.message) }
  agents=a.data||[]; aliases=al.data||[]; carrierNums=cn.data||[]; hier=h.data||[]; agreements=ag.data||[]; sales=s.data||[]
}

async function render(){
  if(!session) return auth()
  app.className='app'
  app.innerHTML='<div class="center">Loading dashboard...</div>'
  try{ await load(); draw() } catch(e){ app.innerHTML=`<div class="auth"><h1>Database needs update</h1><p class="muted">${esc(e.message)}</p><button class="secondary" id="out">Sign Out</button></div>`; document.getElementById('out').onclick=()=>supabase.auth.signOut() }
}

function shell(content){
  const t=sales.reduce((x,s)=>{if(s.status!=='void'){x.g+=num(s.gross_commission);x.a+=num(s.writing_agent_commission);x.u+=num(s.upline_commission);x.h+=num(s.house_commission);if(['unpaid','pending'].includes(s.status))x.o+=num(s.writing_agent_commission)+num(s.upline_commission)}return x},{g:0,a:0,u:0,h:0,o:0})
  app.innerHTML=`<header class="hero"><div><div class="badge">💵 Commission Downline Splitter</div><h1>Agent database + commission report splitter</h1><p>Match uploaded commission reports by writing number, producer number, legal name, or alias. Then identify the upline and show who you owe.</p></div><button class="secondary" id="out">Sign Out</button></header><div class="nav"><button class="${view==='upload'?'on':''}" data-v="upload">Upload Report</button><button class="${view==='agents'?'on':''}" data-v="agents">Agent Database</button><button class="${view==='ledger'?'on':''}" data-v="ledger">Ledger</button></div><div id="msg" style="display:none"></div><section class="stats"><div class="stat"><small>Gross Commission</small><strong>${money.format(t.g)}</strong></div><div class="stat"><small>Writing Agent Pay</small><strong>${money.format(t.a)}</strong></div><div class="stat"><small>Upline Override</small><strong>${money.format(t.u)}</strong></div><div class="stat"><small>House Commission</small><strong>${money.format(t.h)}</strong></div><div class="stat"><small>Unpaid Balance</small><strong>${money.format(t.o)}</strong></div></section>${content}`
  document.getElementById('out').onclick=()=>supabase.auth.signOut()
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; draw()})
}

function draw(){
  if(view==='agents'){ shell(agentsPage()); bindAgents(); return }
  if(view==='ledger'){ shell(ledgerPage()); bindLedger(); return }
  shell(uploadPage()); bindUpload(); drawImportReport()
}

function agentName(a){return a?.legal_name || a?.name || ''}
function agentOptions(exclude=''){return agents.filter(a=>a.id!==exclude).map(a=>`<option value="${a.id}">${esc(agentName(a))}</option>`).join('')}
function uplineFor(id){const h=hier.find(x=>x.agent_id===id);return h?.direct_upline_agent_id?agents.find(a=>a.id===h.direct_upline_agent_id):null}
function agreementFor(id){return agreements.find(a=>a.agent_id===id)}

function agentsPage(){
  return `<div class="grid"><section class="card"><h2>Add Agent</h2><form id="agentForm" class="form"><label>First Name<input name="first_name" required></label><label>Last Name<input name="last_name" required></label><label>Legal Name<input name="legal_name"></label><label>Email<input name="email"></label><label>Phone<input name="phone"></label><label>NPN<input name="npn"></label><label>Producer Number<input name="producer_number"></label><label>Status<select name="status"><option>Active</option><option>Inactive</option><option>Terminated</option><option>Pending</option></select></label><button class="primary">Add Agent</button></form></section><section class="card"><h2>Assign Upline / Override</h2><form id="hierForm" class="stack"><label>Agent<select name="agent_id" required><option value="">Select agent</option>${agentOptions()}</select></label><label>Direct Upline<select name="upline_id"><option value="">No upline</option>${agentOptions()}</select></label><label>Upline Override %<input name="override" type="number" step="0.01" value="0"></label><button class="secondary">Save Hierarchy</button></form></section></div><section class="card"><h2>Agents</h2><div class="table"><div class="row agentRow head"><span>Agent</span><span>Upline</span><span>Override</span><span>Status</span><span>Tools</span></div>${agents.map(a=>{const up=uplineFor(a.id),ag=agreementFor(a.id);return `<div class="row agentRow"><span><b>${esc(agentName(a))}</b><small>${esc(a.email||'')}${a.producer_number?' • Producer # '+esc(a.producer_number):''}</small></span><span>${up?esc(agentName(up)):'—'}</span><span>${ag?round(num(ag.override_percentage)*100)+'%':'—'}</span><span><span class="pill">${esc(a.status||'Active')}</span></span><span class="actions"><button data-edit="${a.id}" class="secondary">IDs/Aliases</button><button data-del-agent="${a.id}" class="danger">Delete</button></span></div>`}).join('')}</div></section>`
}

function bindAgents(){
  agentForm.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const legal=f.legal_name||`${f.first_name} ${f.last_name}`;const {error}=await supabase.from('agents').insert({owner_user_id:session.user.id,name:legal,legal_name:legal,first_name:f.first_name,last_name:f.last_name,email:f.email||null,phone:f.phone||null,npn:f.npn||null,producer_number:f.producer_number||null,status:f.status});if(error)return msg(error.message);await render()}
  hierForm.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.agent_id)return msg('Select an agent.');await supabase.from('agent_hierarchy').update({effective_end_date:today}).eq('agent_id',f.agent_id).is('effective_end_date',null);await supabase.from('override_agreements').update({effective_end_date:today}).eq('agent_id',f.agent_id).is('effective_end_date',null);if(f.upline_id){await supabase.from('agent_hierarchy').insert({owner_user_id:session.user.id,agent_id:f.agent_id,direct_upline_agent_id:f.upline_id});const er=await supabase.from('override_agreements').insert({owner_user_id:session.user.id,agent_id:f.agent_id,upline_agent_id:f.upline_id,override_percentage:num(f.override)/100});if(er.error)return msg(er.error.message)}await render()}
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editIdentity(b.dataset.edit))
  document.querySelectorAll('[data-del-agent]').forEach(b=>b.onclick=()=>delAgent(b.dataset.delAgent))
}
async function editIdentity(id){const a=agents.find(x=>x.id===id);const alias=prompt(`Add alias for ${agentName(a)}. Leave blank to skip.`);if(alias)await supabase.from('agent_aliases').insert({owner_user_id:session.user.id,agent_id:id,alias});const number=prompt('Add carrier writing/producer number. Leave blank to skip.');if(number)await supabase.from('agent_carrier_numbers').insert({owner_user_id:session.user.id,agent_id:id,writing_number:number,carrier_name:null});await render()}
async function delAgent(id){if(!confirm('Delete this agent?'))return;const {error}=await supabase.from('agents').delete().eq('id',id);if(error)msg(error.message);else await render()}

function uploadPage(){return `<section class="card"><h2>Upload Commission Report</h2><p class="muted">Use CSV/TXT upload or paste report text. PDF parsing is temporarily disabled so the page loads reliably. For PDFs, copy/paste the text or export the report as CSV/TXT.</p><div class="two"><div class="upload"><label>File<input id="file" type="file" accept=".csv,.txt,.text"></label><div class="actions"><button id="parseFile" class="primary">Recognize Agents</button><button id="importRows" class="secondary">Import Matched Rows</button><button id="csv" class="secondary">Export Payout CSV</button></div></div><label>Paste report text<textarea id="text"></textarea><button id="parseText" class="secondary" type="button">Analyze Pasted Text</button></label></div><div id="importReport"></div></section>`}
function bindUpload(){parseFile.onclick=async()=>{const f=file.files[0];if(!f)return msg('Choose a CSV or text report first.');if(f.name.toLowerCase().endsWith('.pdf'))return msg('PDF parsing is temporarily disabled. Export as CSV/TXT or paste the report text.');analyze(await f.text(),f.name)};parseText.onclick=()=>analyze(text.value,'Pasted Report');importRows.onclick=importMatched;csv.onclick=exportCsv}

function tokensForAgent(a){const out=[];if(a.producer_number)out.push({type:'producer_number',token:a.producer_number,score:99});if(a.npn)out.push({type:'npn',token:a.npn,score:96});out.push({type:'legal_name',token:agentName(a),score:90});aliases.filter(x=>x.agent_id===a.id).forEach(x=>out.push({type:'alias',token:x.alias,score:85}));carrierNums.filter(x=>x.agent_id===a.id).forEach(x=>out.push({type:'carrier_number',token:x.writing_number,score:100}));return out.filter(x=>x.token)}
function matchAgent(line){const low=line.toLowerCase();let best=null;for(const a of agents){for(const t of tokensForAgent(a)){if(low.includes(String(t.token).toLowerCase())){if(!best||t.score>best.score||String(t.token).length>String(best.token).length)best={agent:a,method:t.type,score:t.score,token:t.token}}}}return best}
function findAmount(line){const matches=line.match(/-?\$?\d{1,3}(?:,\d{3})*(?:\.\d{2})|-?\$?\d+\.\d{2}/g)||[];const values=matches.map(v=>Number(v.replace(/[$,]/g,''))).filter(v=>Number.isFinite(v)&&Math.abs(v)>0);return values.length?Math.abs(values[values.length-1]):0}
function analyze(raw,source){if(!agents.length)return msg('Add agents first.');importRows=[];unmatched=[];const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);lines.forEach((line,i)=>{const m=matchAgent(line),amount=findAmount(line);if(m&&amount>0){const up=uplineFor(m.agent.id),ag=agreementFor(m.agent.id);const upPct=ag?num(ag.override_percentage):num(m.agent.default_upline_split_percent||0)/100;const agentPct=Math.max(0,1-upPct);const agentPay=round(amount*agentPct),uplinePay=round(amount*upPct),house=round(amount-agentPay-uplinePay);importRows.push({lineNumber:i+1,source,line,agent:m.agent,upline:up,method:m.method,confidence:m.score,amount,agentPct,uplinePct:upPct,agentPay,uplinePay,house})}else if(m||amount>0)unmatched.push(line)});draw();msg(`Recognized ${importRows.length} commission lines.`,true)}
function drawImportReport(){const el=document.getElementById('importReport');if(!el||!importRows.length)return;const payees={};importRows.forEach(r=>{addPayee(payees,agentName(r.agent),'Writing Agent',r.agentPay);if(r.upline&&r.uplinePay>0)addPayee(payees,agentName(r.upline),'Upline',r.uplinePay)});const total=importRows.reduce((s,r)=>s+r.amount,0),owed=Object.values(payees).reduce((s,p)=>s+p.amount,0);el.innerHTML=`<section class="stats"><div class="stat"><small>Matched Lines</small><strong>${importRows.length}</strong></div><div class="stat"><small>Gross Commission</small><strong>${money.format(total)}</strong></div><div class="stat"><small>Total Owed</small><strong>${money.format(owed)}</strong></div><div class="stat"><small>Needs Review</small><strong>${unmatched.length}</strong></div><div class="stat"><small>Source</small><strong>Report</strong></div></section><h2>Payee Summary</h2><div class="table"><div class="row payeeRow head"><span>Payee</span><span>Role</span><span>Lines</span><span>Amount Owed</span></div>${Object.values(payees).map(p=>`<div class="row payeeRow"><span><b>${esc(p.name)}</b></span><span>${esc(p.role)}</span><span>${p.count}</span><span><b>${money.format(p.amount)}</b></span></div>`).join('')}</div><h2 style="margin-top:18px">Matched Lines</h2><div class="table"><div class="row importRow head"><span>Writing Agent</span><span>Upline</span><span>Gross</span><span>Agent Pay</span><span>Upline Pay</span><span>Match</span><span>Source Line</span></div>${importRows.map(r=>`<div class="row importRow"><span><b>${esc(agentName(r.agent))}</b><small>Line ${r.lineNumber}</small></span><span>${r.upline?esc(agentName(r.upline)):'—'}</span><span>${money.format(r.amount)}</span><span>${money.format(r.agentPay)}</span><span>${money.format(r.uplinePay)}</span><span>${esc(r.method)}</span><span><small>${esc(r.line)}</small></span></div>`).join('')}</div>`}
function addPayee(map,name,role,amount){const key=name+'|'+role;if(!map[key])map[key]={name,role,count:0,amount:0};map[key].count++;map[key].amount=round(map[key].amount+amount)}
function exportCsv(){if(!importRows.length)return msg('Analyze a report first.');const rows=[['Writing Agent','Upline','Gross','Agent Pay','Upline Pay','Match Method','Source Line']];importRows.forEach(r=>rows.push([agentName(r.agent),r.upline?agentName(r.upline):'',r.amount,r.agentPay,r.uplinePay,r.method,r.line]));const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='commission-payout-report.csv';a.click();URL.revokeObjectURL(url)}
async function importMatched(){if(!importRows.length)return msg('Analyze a report first.');const payloads=importRows.map(r=>({owner_user_id:session.user.id,writing_agent_id:r.agent.id,upline_agent_id:r.upline?.id||null,client_name:`Imported commission line ${r.lineNumber}`,product_type:'Imported Commission Report',carrier:r.source,policy_number:null,sale_date:today,premium:r.amount,commission_rate_percent:100,agent_split_percent:r.agentPct*100,upline_split_percent:r.uplinePct*100,status:'unpaid',notes:r.line}));const {error}=await supabase.from('sales').insert(payloads);if(error)return msg(error.message);importRows=[];unmatched=[];await render();msg('Matched rows imported as unpaid commissions.',true)}

function ledgerPage(){return `<section class="card"><h2>Commission Ledger</h2><div class="table"><div class="row ledgerRow head"><span>Client</span><span>Agent/Upline</span><span>Premium</span><span>Gross</span><span>Agent Pay</span><span>Upline</span><span>Status</span><span>Actions</span></div>${sales.map(s=>`<div class="row ledgerRow"><span><b>${esc(s.client_name)}</b><small>${esc(s.carrier||'')}</small></span><span>${esc(s.writing_agent_name||'')}<small>${s.upline_agent_name?'Upline: '+esc(s.upline_agent_name):'No upline'}</small></span><span>${money.format(num(s.premium))}</span><span>${money.format(num(s.gross_commission))}</span><span>${money.format(num(s.writing_agent_commission))}</span><span>${money.format(num(s.upline_commission))}</span><span><span class="pill ${esc(s.status)}">${esc(s.status)}</span></span><span class="actions">${s.status==='paid'?`<button data-unpaid="${s.id}">Undo</button>`:`<button data-paid="${s.id}">Paid</button>`}<button class="danger" data-del="${s.id}">Delete</button></span></div>`).join('')}</div></section>`}
function bindLedger(){document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>setSaleStatus(b.dataset.paid,'paid'));document.querySelectorAll('[data-unpaid]').forEach(b=>b.onclick=()=>setSaleStatus(b.dataset.unpaid,'unpaid'));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteSale(b.dataset.del))}
async function setSaleStatus(id,status){const {error}=await supabase.from('sales').update({status,paid_at:status==='paid'?new Date().toISOString():null}).eq('id',id);if(error)return msg(error.message);await render()}
async function deleteSale(id){if(!confirm('Delete this sale?'))return;const {error}=await supabase.from('sales').delete().eq('id',id);if(error)return msg(error.message);await render()}

init()
</script>
</body>
</html>
