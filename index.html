<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commission Downline Splitter</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.app{max-width:1450px;margin:auto;padding:24px}.center{display:grid;place-items:center;min-height:100vh}.hero,.card,.stat,.auth{background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.hero{padding:28px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px}.hero h1{font-size:38px;line-height:1;margin:10px 0}.hero p,.muted{color:#64748b}.badge{display:inline-flex;background:#eef2ff;color:#3730a3;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px}.nav{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}.nav button{background:#e2e8f0}.nav button.on,.primary{background:#0f172a!important;color:white}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{padding:16px}.stat small{display:block;color:#64748b}.stat strong{font-size:22px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{padding:20px;margin-bottom:18px}h2{margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stack{display:grid;gap:12px}label{display:grid;gap:6px;font-weight:800;font-size:13px;color:#334155}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px;background:#fff;color:#0f172a}textarea{min-height:115px}button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.notice{padding:12px;border-radius:14px;margin-bottom:14px}.err{background:#fff7ed;border:1px solid #fdba74;color:#9a3412}.ok{background:#ecfdf5;border:1px solid #86efac;color:#166534}.auth{max-width:450px;padding:30px;display:grid;gap:12px}.table{overflow:auto;border:1px solid #e2e8f0;border-radius:16px}.row{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr .8fr .8fr 1fr;gap:10px;align-items:center;padding:12px;border-top:1px solid #e2e8f0;min-width:950px}.row.head{border-top:0;background:#f1f5f9;color:#64748b;text-transform:uppercase;font-size:12px;font-weight:900}.row.agent{grid-template-columns:1.3fr 1fr .8fr .8fr 1.1fr}.row.import{grid-template-columns:1.1fr 1fr .8fr .8fr .8fr .8fr 1.5fr}.row.payee{grid-template-columns:1.3fr .8fr .8fr .8fr}.row small{display:block;color:#64748b}.pill{padding:4px 8px;border-radius:999px;background:#e2e8f0}.paid{background:#dcfce7;color:#166534}.unpaid,.pending{background:#fef3c7;color:#92400e}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.on{background:#0f172a;color:#fff}.actions{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{border:2px dashed #cbd5e1;border-radius:18px;padding:18px;background:#f8fafc}.hidden{display:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.two,.form{grid-template-columns:1fr}.hero{display:block}.hero h1{font-size:32px}}
</style></head><body><div id="app" class="center">Loading...</div><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.56.0';import*as pdfjsLib from'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const supabase=createClient('https://susiqseuoaorryqnlvwl.supabase.co','sb_publishable_Tu-SYomgQ312CpEnS6x1pw_hXrLyVtF'),app=document.getElementById('app'),money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}),today=new Date().toISOString().slice(0,10);let session=null,agents=[],aliases=[],carrierNums=[],hier=[],agreements=[],sales=[],view='upload',importRows=[],unmatched=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v||0),round=v=>Math.round(v*100)/100;
async function init(){const{data}=await supabase.auth.getSession();session=data.session;supabase.auth.onAuthStateChange((_,s)=>{session=s;render()});render()}function msg(m,ok=false){let el=document.getElementById('msg');if(el){el.className='notice '+(ok?'ok':'err');el.textContent=m;el.style.display='block'}else alert(m)}
function auth(){app.className='center';app.innerHTML=`<form class="auth" id="login"><div class="badge">💵 Commission Downline Splitter</div><h1>Login</h1><p class="muted">Upload commission reports, identify writing agents and uplines, and calculate payouts.</p><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required minlength="6"></label><div id="loginmsg" class="notice err hidden"></div><button class="primary">Sign In</button><button class="secondary" id="signup" type="button">Create Account</button></form>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginmsg.textContent=error.message;loginmsg.classList.remove('hidden')}};signup.onclick=async()=>{const{error}=await supabase.auth.signUp({email:email.value,password:password.value});loginmsg.textContent=error?error.message:'Account created. Check email confirmation settings if login does not start automatically.';loginmsg.classList.remove('hidden')}}
async function load(){const gets=['agents','agent_aliases','agent_carrier_numbers','agent_hierarchy','override_agreements'];const [a,al,cn,h,ag,s]=await Promise.all([supabase.from('agents').select('*').order('legal_name'),supabase.from('agent_aliases').select('*'),supabase.from('agent_carrier_numbers').select('*'),supabase.from('agent_hierarchy').select('*').is('effective_end_date',null),supabase.from('override_agreements').select('*').is('effective_end_date',null),supabase.from('sales_with_agents').select('*').order('sale_date',{ascending:false})]);for(const r of[a,al,cn,h,ag,s])if(r.error)msg(r.error.message);agents=a.data||[];aliases=al.data||[];carrierNums=cn.data||[];hier=h.data||[];agreements=ag.data||[];sales=s.data||[]}
async function render(){if(!session)return auth();app.className='app';app.innerHTML='<div class="center">Loading...</div>';await load();draw()}
function shell(content){const t=sales.reduce((x,s)=>{if(s.status!=='void'){x.g+=num(s.gross_commission);x.a+=num(s.writing_agent_commission);x.u+=num(s.upline_commission);x.h+=num(s.house_commission);if(['unpaid','pending'].includes(s.status))x.o+=num(s.writing_agent_commission)+num(s.upline_commission)}return x},{g:0,a:0,u:0,h:0,o:0});app.innerHTML=`<header class="hero"><div><div class="badge">💵 Commission Downline Splitter</div><h1>Agent database + commission report splitter</h1><p>Match uploaded commission reports by writing number, producer number, legal name, or alias. Then identify the upline and show who you owe.</p></div><button class="secondary" id="out">Sign Out</button></header><div class="nav"><button class="${view==='upload'?'on':''}" data-v="upload">Upload Report</button><button class="${view==='agents'?'on':''}" data-v="agents">Agent Database</button><button class="${view==='ledger'?'on':''}" data-v="ledger">Ledger</button></div><div id="msg" style="display:none"></div><section class="stats"><div class="stat"><small>Gross Commission</small><strong>${money.format(t.g)}</strong></div><div class="stat"><small>Writing Agent Pay</small><strong>${money.format(t.a)}</strong></div><div class="stat"><small>Upline Override</small><strong>${money.format(t.u)}</strong></div><div class="stat"><small>House Commission</small><strong>${money.format(t.h)}</strong></div><div class="stat"><small>Unpaid Balance</small><strong>${money.format(t.o)}</strong></div></section>${content}`;out.onclick=()=>supabase.auth.signOut();document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()})}
function draw(){if(view==='agents')return shell(agentsPage());if(view==='ledger')return shell(ledgerPage());shell(uploadPage());bindUpload()}
function agentsPage(){return `<div class="grid"><section class="card"><h2>Add Agent</h2><form id="agentForm" class="form"><label>First Name<input name="first_name" required></label><label>Last Name<input name="last_name" required></label><label>Legal Name<input name="legal_name"></label><label>Email<input name="email"></label><label>Phone<input name="phone"></label><label>NPN<input name="npn"></label><label>Producer Number<input name="producer_number"></label><label>Status<select name="status"><option>Active</option><option>Inactive</option><option>Terminated</option><option>Pending</option></select></label><button class="primary">Add Agent</button></form></section><section class="card"><h2>Assign Upline / Override</h2><form id="hierForm" class="stack"><label>Agent<select name="agent_id" required>${agentOptions()}</select></label><label>Direct Upline<select name="upline_id"><option value="">No upline</option>${agentOptions()}</select></label><label>Upline Override %<input name="override" type="number" step="0.01" value="0"></label><button class="secondary">Save Hierarchy</button></form></section></div><section class="card"><h2>Agents</h2><div class="table"><div class="row agent head"><span>Agent</span><span>Upline</span><span>Override</span><span>Status</span><span>Tools</span></div>${agents.map(agentRow).join('')}</div></section>`}
function agentOptions(){return agents.map(a=>`<option value="${a.id}">${esc(a.legal_name||a.name)}</option>`).join('')}function uplineFor(id){let h=hier.find(x=>x.agent_id===id);return h?.direct_upline_agent_id?agents.find(a=>a.id===h.direct_upline_agent_id):null}function agreementFor(id){return agreements.find(a=>a.agent_id===id)}
function agentRow(a){let up=uplineFor(a.id),ag=agreementFor(a.id);return `<div class="row agent"><span><b>${esc(a.legal_name||a.name)}</b><small>${esc(a.email||'')} ${a.producer_number?' • Producer # '+esc(a.producer_number):''}</small></span><span>${up?esc(up.legal_name||up.name):'—'}</span><span>${ag?round(num(ag.override_percentage)*100)+'%':'—'}</span><span><span class="pill">${esc(a.status||'Active')}</span></span><span class="actions"><button data-edit="${a.id}" class="secondary">IDs/Aliases</button><button data-del-agent="${a.id}" class="danger">Delete</button></span></div>`}
function bindAgents(){agentForm.onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let legal=f.legal_name||`${f.first_name} ${f.last_name}`;let{error}=await supabase.from('agents').insert({owner_user_id:session.user.id,name:legal,legal_name:legal,first_name:f.first_name,last_name:f.last_name,email:f.email||null,phone:f.phone||null,npn:f.npn||null,producer_number:f.producer_number||null,status:f.status});if(error)return msg(error.message);await render()};hierForm.onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));await supabase.from('agent_hierarchy').update({effective_end_date:today}).eq('agent_id',f.agent_id).is('effective_end_date',null);await supabase.from('override_agreements').update({effective_end_date:today}).eq('agent_id',f.agent_id).is('effective_end_date',null);if(f.upline_id){await supabase.from('agent_hierarchy').insert({owner_user_id:session.user.id,agent_id:f.agent_id,direct_upline_agent_id:f.upline_id});let er=await supabase.from('override_agreements').insert({owner_user_id:session.user.id,agent_id:f.agent_id,upline_agent_id:f.upline_id,override_percentage:num(f.override)/100});if(er.error)return msg(er.error.message)}await render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editIdentity(b.dataset.edit));document.querySelectorAll('[data-del-agent]').forEach(b=>b.onclick=()=>delAgent(b.dataset.delAgent))}
async function editIdentity(id){let a=agents.find(x=>x.id===id),alias=prompt(`Add alias for ${a.legal_name||a.name}. Leave blank to skip.`);if(alias)await supabase.from('agent_aliases').insert({owner_user_id:session.user.id,agent_id:id,alias});let numbr=prompt('Add carrier writing/producer number. Leave blank to skip.');if(numbr)await supabase.from('agent_carrier_numbers').insert({owner_user_id:session.user.id,agent_id:id,writing_number:numbr,carrier_name:null});await render()}async function delAgent(id){if(!confirm('Delete this agent? Historical sales/import rows remain preserved by snapshot/references where possible.'))return;let{error}=await supabase.from('agents').delete().eq('id',id);if(error)msg(error.message);else await render()}
function uploadPage(){return `<section class="card"><h2>Upload Commission Report</h2><p class="muted">Upload PDF/CSV/TXT or paste text. Match order: carrier writing number, producer number, legal name, alias, fuzzy name.</p><div class="two"><div class="upload"><label>File<input id="file" type="file" accept=".pdf,.csv,.txt,.text"></label><div class="actions"><button id="parseFile" class="primary">Recognize Agents</button><button id="importRows" class="secondary">Import Matched Rows</button><button id="csv" class="secondary">Export Payout CSV</button></div></div><label>Paste report text<textarea id="text"></textarea><button id="parseText" class="secondary" type="button">Analyze Pasted Text</button></label></div><div id="importReport"></div></section>`}
function bindUpload(){parseFile.onclick=async()=>{let f=file.files[0];if(!f)return msg('Choose a report first.');let text=f.name.toLowerCase().endsWith('.pdf')?await pdfText(f):await f.text();analyze(text,f.name)};parseText.onclick=()=>analyze(text.value,'Pasted Report');importRows.onclick=importMatched;csv.onclick=exportCsv;drawImportReport()}async function pdfText(file){let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,out='';for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),c=await p.getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n'}return out}
function tokensForAgent(a){let t=[a.legal_name,a.name,a.producer_number,a.npn].filter(Boolean);aliases.filter(x=>x.agent_id===a.id).forEach(x=>t.push(x.alias));carrierNums.filter(x=>x.agent_id===a.id).forEach(x=>t.push(x.writing_number));return t.map(x=>String(x).toLowerCase()).filter(x=>x.length>1)}function matchAgent(line){let l=line.toLowerCase();for(let c of carrierNums){if(c.writing_number&&l.includes(String(c.writing_number).toLowerCase()))return{agent:agents.find(a=>a.id===c.agent_id),method:'carrier writing number',confidence:99}}for(let a of agents){if(a.producer_number&&l.includes(String(a.producer_number).toLowerCase()))return{agent:a,method:'producer number',confidence:98}}let best=null;for(let a of agents){for(let tok of tokensForAgent(a)){if(l.includes(tok)){let score=tok===String(a.legal_name||a.name).toLowerCase()?95:85;if(!best||score>best.confidence)best={agent:a,method:'name/alias',confidence:score}}}return best}
function amount(line){let m=line.match(/-?\$?\d{1,3}(?:,\d{3})*(?:\.\d{2})|-?\$?\d+\.\d{2}/g)||[];let vals=m.map(x=>Number(x.replace(/[$,]/g,''))).filter(Number.isFinite);return vals.length?Math.abs(vals.at(-1)):0}function analyze(text,source){importRows=[];unmatched=[];text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach((line,i)=>{let gross=amount(line),m=matchAgent(line);if(m?.agent&&gross>0){let up=uplineFor(m.agent.id),ag=agreementFor(m.agent.id),upPct=num(ag?.override_percentage||0),agentPct=num(m.agent.default_agent_split_percent||70)/100,agentPay=round(gross*agentPct),upPay=round(gross*upPct),house=round(gross-agentPay-upPay);importRows.push({source,line,line_number:i+1,agent:m.agent,upline:up,gross,agentPct,upPct,agentPay,upPay,house,method:m.method,confidence:m.confidence})}else if(gross>0||m?.agent)unmatched.push(line)});draw();msg(`Recognized ${importRows.length} payable commission lines.`,true)}
function drawImportReport(){let el=document.getElementById('importReport');if(!el)return;if(!importRows.length){el.innerHTML='<p class="muted">No report analyzed yet.</p>';return}let pay={};importRows.forEach(r=>{addPay(pay,r.agent,'writing_agent',r.agentPay);if(r.upline&&r.upPay>0)addPay(pay,r.upline,'upline',r.upPay)});el.innerHTML=`<section class="stats"><div class="stat"><small>Matched Lines</small><strong>${importRows.length}</strong></div><div class="stat"><small>Needs Review</small><strong>${unmatched.length}</strong></div><div class="stat"><small>Gross</small><strong>${money.format(importRows.reduce((s,r)=>s+r.gross,0))}</strong></div><div class="stat"><small>Total Owed</small><strong>${money.format(Object.values(pay).reduce((s,p)=>s+p.amount,0))}</strong></div><div class="stat"><small>House</small><strong>${money.format(importRows.reduce((s,r)=>s+r.house,0))}</strong></div></section><h3>Payee Report</h3><div class="table"><div class="row payee head"><span>Payee</span><span>Role</span><span>Lines</span><span>Amount Owed</span></div>${Object.values(pay).map(p=>`<div class="row payee"><span><b>${esc(p.name)}</b></span><span>${p.role}</span><span>${p.count}</span><span><b>${money.format(p.amount)}</b></span></div>`).join('')}</div><h3>Matched Lines</h3><div class="table"><div class="row import head"><span>Writing Agent</span><span>Upline</span><span>Gross</span><span>Agent Pay</span><span>Upline Pay</span><span>House</span><span>Match / Line</span></div>${importRows.map(r=>`<div class="row import"><span><b>${esc(r.agent.legal_name||r.agent.name)}</b><small>${r.confidence}% ${r.method}</small></span><span>${esc(r.upline?.legal_name||r.upline?.name||'No upline')}</span><span>${money.format(r.gross)}</span><span>${money.format(r.agentPay)}</span><span>${money.format(r.upPay)}</span><span>${money.format(r.house)}</span><span><small>${esc(r.line)}</small></span></div>`).join('')}</div>`}function addPay(o,a,role,amt){let k=a.id+'|'+role;if(!o[k])o[k]={name:a.legal_name||a.name,role,count:0,amount:0,agent:a};o[k].count++;o[k].amount=round(o[k].amount+amt)}
async function importMatched(){if(!importRows.length)return msg('Analyze a report first.');let payload=importRows.map(r=>({owner_user_id:session.user.id,writing_agent_id:r.agent.id,upline_agent_id:r.upline?.id||null,client_name:`Imported line ${r.line_number}`,product_type:'Imported Commission Report',carrier:r.source,policy_number:null,sale_date:today,premium:r.gross,commission_rate_percent:100,agent_split_percent:round(r.agentPct*100),upline_split_percent:round(r.upPct*100),status:'unpaid',notes:r.line}));let{error}=await supabase.from('sales').insert(payload);if(error)return msg(error.message);importRows=[];await render();msg('Matched rows imported as unpaid commissions.',true)}function exportCsv(){if(!importRows.length)return msg('Analyze a report first.');let rows=[['Writing Agent','Upline','Gross','Agent Pay','Upline Pay','House','Match Method','Source Line']];importRows.forEach(r=>rows.push([r.agent.legal_name||r.agent.name,r.upline?.legal_name||'',r.gross,r.agentPay,r.upPay,r.house,r.method,r.line]));let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='payout-report.csv';a.click();URL.revokeObjectURL(u)}
function ledgerPage(){return `<section class="card"><h2>Commission Ledger</h2><div class="table"><div class="row head"><span>Client</span><span>Agent</span><span>Gross</span><span>Agent Pay</span><span>Upline Pay</span><span>Status</span><span>Actions</span></div>${sales.map(s=>`<div class="row"><span><b>${esc(s.client_name)}</b><small>${esc(s.carrier||'')}</small></span><span>${esc(s.writing_agent_name||'')}</span><span>${money.format(num(s.gross_commission))}</span><span>${money.format(num(s.writing_agent_commission))}</span><span>${money.format(num(s.upline_commission))}</span><span><span class="pill ${s.status}">${s.status}</span></span><span><button data-paid="${s.id}">Paid</button></span></div>`).join('')}</div></section>`}
function bindLedger(){document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=async()=>{await supabase.from('sales').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',b.dataset.paid);await render()})}
const oldDraw=draw;draw=function(){if(view==='agents'){shell(agentsPage());bindAgents();return}if(view==='ledger'){shell(ledgerPage());bindLedger();return}shell(uploadPage());bindUpload()};
init();
</script></body></html>
