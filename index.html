<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commission Downline Splitter</title>
  <style>
    :root{font-family:Inter,system-ui,Arial,sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.app{max-width:1400px;margin:auto;padding:28px}.center{display:grid;place-items:center;min-height:100vh}.hero,.auth-card,.card,.stat{background:white;border:1px solid #e2e8f0;border-radius:28px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;padding:34px;margin-bottom:20px}.hero h1,.auth-card h1{font-size:42px;line-height:1;margin:12px 0}.hero p,.auth-card p{color:#64748b;max-width:760px}.badge{display:inline-flex;align-items:center;gap:8px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}.stat{padding:18px}.stat small{color:#64748b;display:block}.stat strong{display:block;font-size:22px;margin-top:6px}.stat.highlight{background:#0f172a;color:white}.stat.highlight small{color:#cbd5e1}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}.card{padding:24px}.card h2{display:flex;align-items:center;gap:8px;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stack{display:grid;gap:14px}label{display:grid;gap:7px;font-weight:700;font-size:13px;color:#334155}input,select{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:12px;background:white;color:#0f172a}button{border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary{background:#0f172a;color:white}.secondary{background:#e2e8f0;color:#0f172a}.error,.notice{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:12px 14px;border-radius:16px;margin-bottom:16px}.auth-page{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{max-width:460px;padding:34px;display:grid;gap:14px}.ledger-head{display:flex;justify-content:space-between;gap:16px;align-items:center}.filters{display:flex;align-items:center;gap:8px}.table{overflow:auto;border:1px solid #e2e8f0;border-radius:18px}.row{display:grid;grid-template-columns:1.35fr 1.15fr .8fr .8fr .8fr .8fr .8fr .7fr 1fr;gap:12px;align-items:center;padding:14px;border-top:1px solid #e2e8f0;min-width:1100px}.row.head{border-top:0;background:#f1f5f9;font-size:12px;text-transform:uppercase;color:#64748b;font-weight:900}.row small{display:block;color:#64748b;margin-top:4px}.pill{padding:5px 9px;border-radius:999px;text-transform:capitalize;background:#e2e8f0}.pill.unpaid,.pill.pending{background:#fef3c7;color:#92400e}.pill.paid{background:#dcfce7;color:#166534}.pill.chargeback{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.hero{flex-direction:column}.hero h1{font-size:34px}}
  </style>
</head>
<body>
  <div id="app" class="center">Loading...</div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.56.0'

    const supabase = createClient('https://susiqseuoaorryqnlvwl.supabase.co', 'sb_publishable_Tu-SYomgQ312CpEnS6x1pw_hXrLyVtF')
    const app = document.getElementById('app')
    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })
    const today = new Date().toISOString().slice(0, 10)
    let session = null
    let agents = []
    let sales = []
    let searchText = ''
    let statusFilter = 'all'

    async function init(){
      const { data } = await supabase.auth.getSession()
      session = data.session
      supabase.auth.onAuthStateChange((_event, nextSession) => { session = nextSession; render() })
      render()
    }

    function esc(v){ return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])) }
    function num(v){ return Number(v || 0) }

    async function loadData(){
      const [{ data: a, error: ae }, { data: s, error: se }] = await Promise.all([
        supabase.from('agents').select('*').order('name'),
        supabase.from('sales_with_agents').select('*').order('sale_date', { ascending:false })
      ])
      if (ae || se) showError(ae?.message || se?.message || 'Could not load data')
      agents = a || []
      sales = s || []
    }

    function showError(message){
      const box = document.getElementById('errorBox')
      if (box) { box.textContent = message; box.style.display = 'block' }
      else alert(message)
    }

    function authScreen(){
      app.className = 'auth-page'
      app.innerHTML = `
        <form class="auth-card" id="loginForm">
          <div class="badge">💵 Commission Downline Splitter</div>
          <h1>Login to your commission tracker</h1>
          <p>Track agent sales, split commissions, pay downlines, and monitor unpaid balances.</p>
          <label>Email<input id="email" type="email" required /></label>
          <label>Password<input id="password" type="password" required minlength="6" /></label>
          <div id="message" class="notice" style="display:none"></div>
          <button class="primary" type="submit">Sign In</button>
          <button class="secondary" type="button" id="signUpBtn">Create Account</button>
        </form>`
      document.getElementById('loginForm').onsubmit = async e => {
        e.preventDefault()
        const email = document.getElementById('email').value
        const password = document.getElementById('password').value
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) setMessage(error.message)
      }
      document.getElementById('signUpBtn').onclick = async () => {
        const email = document.getElementById('email').value
        const password = document.getElementById('password').value
        const { error } = await supabase.auth.signUp({ email, password })
        setMessage(error ? error.message : 'Account created. Check Supabase email confirmation settings if login does not start automatically.')
      }
    }

    function setMessage(message){
      const el = document.getElementById('message')
      el.textContent = message
      el.style.display = 'block'
    }

    async function dashboard(){
      app.className = 'app'
      app.innerHTML = '<div class="center">Loading dashboard...</div>'
      await loadData()
      drawDashboard()
    }

    function drawDashboard(){
      const totals = sales.reduce((acc, s) => {
        if (s.status !== 'void') {
          acc.premium += num(s.premium); acc.gross += num(s.gross_commission); acc.agent += num(s.writing_agent_commission); acc.upline += num(s.upline_commission); acc.house += num(s.house_commission)
          if (s.status === 'paid') acc.paid += num(s.writing_agent_commission) + num(s.upline_commission)
          if (s.status === 'unpaid' || s.status === 'pending') acc.unpaid += num(s.writing_agent_commission) + num(s.upline_commission)
        }
        return acc
      }, { premium:0, gross:0, agent:0, upline:0, house:0, paid:0, unpaid:0 })
      const filtered = sales.filter(s => {
        const hay = [s.client_name, s.carrier, s.product_type, s.policy_number, s.writing_agent_name, s.upline_agent_name].join(' ').toLowerCase()
        return (statusFilter === 'all' || s.status === statusFilter) && hay.includes(searchText.toLowerCase())
      })
      app.innerHTML = `
        <header class="hero"><div><div class="badge">💵 Commission Downline Splitter</div><h1>Sales, downlines, overrides, and payouts.</h1><p>Enter a sale once. The app calculates writing agent commission, upline override, house commission, and unpaid balances.</p></div><button class="secondary" id="signOut">Sign Out</button></header>
        <div id="errorBox" class="error" style="display:none"></div>
        <section class="stats">${stat('Total Premium', totals.premium)}${stat('Gross Commission', totals.gross)}${stat('Writing Agent Pay', totals.agent)}${stat('Upline Override', totals.upline)}${stat('House Commission', totals.house)}${stat('Unpaid Balance', totals.unpaid, true)}</section>
        <main class="grid">
          <section class="card wide"><h2>➕ Enter Sale</h2><form id="saleForm" class="form-grid">
            <label>Client Name<input name="client_name" required /></label>
            <label>Writing Agent<select name="writing_agent_id" required><option value="">Select agent</option>${agents.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
            <label>Upline / Recruiter<select name="upline_agent_id"><option value="">None</option>${agents.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
            <label>Product<input name="product_type" placeholder="Annuity, Life, Final Expense" /></label>
            <label>Carrier<input name="carrier" /></label>
            <label>Policy #<input name="policy_number" /></label>
            <label>Sale Date<input name="sale_date" type="date" value="${today}" /></label>
            <label>Premium<input name="premium" required type="number" min="0" step="0.01" /></label>
            <label>Commission Rate %<input name="commission_rate_percent" required type="number" min="0" step="0.0001" /></label>
            <label>Agent Split %<input name="agent_split_percent" type="number" min="0" max="100" step="0.01" value="70" /></label>
            <label>Upline Split %<input name="upline_split_percent" type="number" min="0" max="100" step="0.01" value="0" /></label>
            <label>Notes<input name="notes" /></label>
            <button class="primary">Add Sale</button>
          </form></section>
          <section class="card"><h2>👥 Add Agent</h2><form id="agentForm" class="stack">
            <label>Name<input name="name" required /></label>
            <label>Email<input name="email" /></label>
            <label>Phone<input name="phone" /></label>
            <label>Default Agent Split %<input name="default_agent_split_percent" type="number" min="0" max="100" step="0.01" value="70" /></label>
            <label>Default Upline Split %<input name="default_upline_split_percent" type="number" min="0" max="100" step="0.01" value="0" /></label>
            <label>Upline Agent<select name="upline_agent_id"><option value="">None</option>${agents.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
            <button class="secondary">Add Agent</button>
          </form></section>
        </main>
        <section class="card"><div class="ledger-head"><h2>Commission Ledger</h2><div class="filters">🔎<input id="search" placeholder="Search client, agent, carrier..." value="${esc(searchText)}"/><select id="status"><option value="all">All</option><option value="pending">Pending</option><option value="unpaid">Unpaid</option><option value="paid">Paid</option><option value="chargeback">Chargeback</option><option value="void">Void</option></select></div></div>
          <div class="table"><div class="row head"><span>Client</span><span>Agent / Upline</span><span>Premium</span><span>Gross</span><span>Agent Pay</span><span>Upline</span><span>House</span><span>Status</span><span>Actions</span></div>${filtered.map(row).join('')}</div>
        </section>`
      document.getElementById('signOut').onclick = () => supabase.auth.signOut()
      document.getElementById('search').oninput = e => { searchText = e.target.value; drawDashboard() }
      document.getElementById('status').value = statusFilter
      document.getElementById('status').onchange = e => { statusFilter = e.target.value; drawDashboard() }
      document.querySelector('[name="writing_agent_id"]').onchange = e => {
        const a = agents.find(x => x.id === e.target.value)
        if (a) {
          document.querySelector('[name="upline_agent_id"]').value = a.upline_agent_id || ''
          document.querySelector('[name="agent_split_percent"]').value = a.default_agent_split_percent || 70
          document.querySelector('[name="upline_split_percent"]').value = a.default_upline_split_percent || 0
        }
      }
      document.getElementById('agentForm').onsubmit = addAgent
      document.getElementById('saleForm').onsubmit = addSale
      document.querySelectorAll('[data-paid]').forEach(b => b.onclick = () => markStatus(b.dataset.paid, 'paid'))
      document.querySelectorAll('[data-unpaid]').forEach(b => b.onclick = () => markStatus(b.dataset.unpaid, 'unpaid'))
      document.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteSale(b.dataset.delete))
    }

    function stat(label, value, highlight=false){ return `<div class="stat ${highlight?'highlight':''}"><small>${label}</small><strong>${money.format(value)}</strong></div>` }
    function row(s){ return `<div class="row"><span><b>${esc(s.client_name)}</b><small>${esc(s.carrier || 'No carrier')} • ${esc(s.product_type || 'No product')}</small></span><span>${esc(s.writing_agent_name || '')}<small>${s.upline_agent_name ? 'Upline: '+esc(s.upline_agent_name) : 'No upline'}</small></span><span>${money.format(num(s.premium))}</span><span>${money.format(num(s.gross_commission))}</span><span>${money.format(num(s.writing_agent_commission))}</span><span>${money.format(num(s.upline_commission))}</span><span>${money.format(num(s.house_commission))}</span><span><b class="pill ${esc(s.status)}">${esc(s.status)}</b></span><span class="actions">${s.status === 'paid' ? `<button data-unpaid="${s.id}">Undo</button>` : `<button data-paid="${s.id}">✅ Paid</button>`}<button data-delete="${s.id}">🗑️</button></span></div>` }

    async function addAgent(e){
      e.preventDefault()
      const f = Object.fromEntries(new FormData(e.target).entries())
      const payload = { owner_user_id: session.user.id, name:f.name, email:f.email||null, phone:f.phone||null, default_agent_split_percent:num(f.default_agent_split_percent), default_upline_split_percent:num(f.default_upline_split_percent), upline_agent_id:f.upline_agent_id||null, notes:null }
      const { error } = await supabase.from('agents').insert(payload)
      if (error) return showError(error.message)
      await dashboard()
    }

    async function addSale(e){
      e.preventDefault()
      const f = Object.fromEntries(new FormData(e.target).entries())
      const payload = { owner_user_id: session.user.id, writing_agent_id:f.writing_agent_id, upline_agent_id:f.upline_agent_id||null, client_name:f.client_name, product_type:f.product_type||null, carrier:f.carrier||null, policy_number:f.policy_number||null, sale_date:f.sale_date||today, premium:num(f.premium), commission_rate_percent:num(f.commission_rate_percent), agent_split_percent:num(f.agent_split_percent), upline_split_percent:num(f.upline_split_percent), status:'unpaid', notes:f.notes||null }
      const { error } = await supabase.from('sales').insert(payload)
      if (error) return showError(error.message)
      await dashboard()
    }

    async function markStatus(id, status){
      const { error } = await supabase.from('sales').update({ status, paid_at: status === 'paid' ? new Date().toISOString() : null }).eq('id', id)
      if (error) return showError(error.message)
      await dashboard()
    }

    async function deleteSale(id){
      if (!confirm('Delete this sale?')) return
      const { error } = await supabase.from('sales').delete().eq('id', id)
      if (error) return showError(error.message)
      await dashboard()
    }

    function render(){ session ? dashboard() : authScreen() }
    init()
  </script>
</body>
</html>
